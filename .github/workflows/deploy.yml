name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  # Lets you re-run the deploy by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running deploy finish rather than cancelling it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: Frontend

      # A failing lint or test stops the deploy before anything is published.
      - name: Lint
        run: npm run lint
        working-directory: Frontend

      - name: Unit tests
        run: npm test
        working-directory: Frontend

      # Works out the site's base path (/<repo-name> for a project site, empty for <user>.github.io).
      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: npm run build
        working-directory: Frontend
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Set these under Settings -> Secrets and variables -> Actions -> Variables.
          # AI provider keys are deliberately not passed: a built site is public, so each visitor adds their own in Settings.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./Frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
